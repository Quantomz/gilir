name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gilir
          POSTGRES_PASSWORD: gilir_ci
          POSTGRES_DB: gilir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gilir -d gilir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gilir:gilir_ci@127.0.0.1:5432/gilir_test
      B3_TEST_DATABASE_URL: postgresql://gilir:gilir_ci@127.0.0.1:5432/gilir_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
