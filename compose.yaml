services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: gilir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gilir
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gilir -d gilir"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
